# Stage 0b convergence study (generated by research/scripts/make_stage0b_configs.py)
backend: quantax
runner: mixd.train_quantax
system:
  lattice: multilayer_square
  lx: 4
  ly: 2
  n_layers: 3
  pbc:
  - true
  - true
  hamiltonian: mixd_heisenberg
  spin_convention: S
  j_par: 1.0
  j_perp: 1.0
  msr: true
  reference: ed/stage0/4x2x3_pp_jpar1_jperp1.json
model:
  ansatz: resconv
  nblocks: 4
  channels: 16
  kernel_size: 3
  final_activation: exp
  projection:
  - spin_inverse
training:
  seed: 42
  nsamples: 1024
  stage1_steps: 600
  stage2_steps: 600
  learning_rate: 0.005
  stage2_learning_rate: 0.005
  optimizer: sr
  reweight: 2.0
  sampler_neighbors:
  - 1
  max_parallel_stage1: 4096
  max_parallel_stage2: 2048
telemetry:
  experiment_name: stage0b_trilayer_4x2_wide
  use_wandb: false
  log_every: 100
