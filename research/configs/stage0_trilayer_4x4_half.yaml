# Stage 0 NQS (target size): half-filled mixD TRILAYER Heisenberg on 4x4x3 (48 sites)
# Beyond ED. Reference options: (a) size trend from ED-verified 4x2x3 run,
# (b) sign-free QMC (SSE) - the half-filled bipartite multilayer Heisenberg model has
# no sign problem, so an exact stochastic reference is available at this size.

backend: quantax

system:
  lattice: multilayer_square
  lx: 4
  ly: 4
  n_layers: 3
  pbc: [true, true]
  hamiltonian: mixd_heisenberg
  spin_convention: S
  j_par: 1.0
  j_perp: 1.0
  msr: true
  reference: none

model:
  ansatz: resconv
  nblocks: 2
  channels: 8
  kernel_size: 3
  final_activation: exp
  layer_axis: grid
  disable_tf32: false

training:
  seed: 42
  nsamples: 1024
  stage1_steps: 300
  stage2_steps: 300
  learning_rate: 0.005
  stage2_learning_rate: 0.005
  optimizer: sr
  reweight: 2.0
  sampler_neighbors: [1]

telemetry:
  experiment_name: stage0_trilayer_4x4_half
  use_wandb: false
