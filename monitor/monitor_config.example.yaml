# ==============================================================================
# GCP VM Watchdog Configuration Template
# Usage: copy to monitor/monitor_config.yaml and set your private ntfy topic
# ==============================================================================

wandb_project: nqs-colab
wandb_entity: null             # Leave null to use the default entity for WANDB_API_KEY
poll_interval_sec: 120         # Poll W&B API every 2 minutes
stale_timeout_sec: 360         # Alert if no heartbeat arrives for 6 minutes
max_runs_to_check: 10

# Mobile push alerts via ntfy.sh (free, open-source, no signup required)
# Install the ntfy app on your phone and subscribe to a unique topic name:
ntfy_topic: "nqs-colab-change-me-83921"

# Optional: Discord / Slack / custom webhook URL
webhook_url: null
