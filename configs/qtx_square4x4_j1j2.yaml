# 4x4 2D Square-Lattice Frustrated J1-J2 Heisenberg Model (J2/J1 = 0.5)
# Quantax v0.4.0 two-stage ResConv (sinhp1_by_log real signed) + MinSR/SR + C4v x Z2 symmetry projection
# Includes QuSpin Exact ED, symm-test overlap, binning measurement, and ODR zero-variance extrapolation.

backend: quantax

system:
  lattice: square
  lx: 4
  hamiltonian: j1j2
  j1: 1.0
  j2: 0.5
  msr: true
  compute_exact: true

model:
  ansatz: resconv
  nblocks: 2
  channels: 8
  kernel_size: 3
  final_activation: sinhp1_by_log
  disable_tf32: false

training:
  seed: 42
  nsamples: 1024
  stage1_steps: 300
  stage2_steps: 300
  learning_rate: 0.005
  stage2_learning_rate: 0.005
  optimizer: sr
  reweight: 2.0
  max_parallel_stage1: 20000
  max_parallel_stage2: 1024
  sampler_neighbors: [1, 2]

analysis:
  run_symm_test: true
  run_binning: true
  measure_nchains: 512
  measure_nsweeps: 64
  run_zero_var_extrap: true

telemetry:
  experiment_name: qtx_square4x4_j1j2
  wandb_project: nqs-colab
  use_wandb: true
  log_every: 25
  checkpoint_dir: checkpoints
  upload_wandb_artifact: true
