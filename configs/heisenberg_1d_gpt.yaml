# ==============================================================================
# Advanced Benchmark #3: 1D Antiferromagnetic Heisenberg Chain (L=12)
# Ansatz: Complex-Phase Causal Transformer (learns nontrivial sign/phase structure)
# ==============================================================================

system:
  hamiltonian: heisenberg_1d
  n_spins: 12
  j_coupling: 1.0
  periodic: true
  compute_exact: true

model:
  ansatz: gpt
  d_model: 32
  n_heads: 4
  n_layers: 2
  mlp_ratio: 2
  use_phase: true       # Enable [-pi, pi] phase head for Marshall sign / complex phases

training:
  seed: 42
  n_samples: 1024
  n_steps: 600
  optimizer: adam
  learning_rate: 0.002
  use_sr: false
  target_rel_error: 0.001

telemetry:
  experiment_name: heisenberg1d_L12_transformer
  wandb_project: nqs-colab
  use_wandb: true
  log_every: 10
  checkpoint_every: 50
  checkpoint_dir: checkpoints
  upload_wandb_checkpoint: true
