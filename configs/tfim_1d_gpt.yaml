# ==============================================================================
# Modern Autoregressive Benchmark #2: 1D Critical TFIM (L=12, h=1.0)
# Ansatz: Causal Transformer (ARNN) + Exact Direct Sampling (ARDirectSampler)
# Expected Colab T4 GPU runtime: ~45-90 seconds
# ==============================================================================

system:
  hamiltonian: tfim_1d
  n_spins: 12
  h_field: 1.0
  j_coupling: 1.0
  periodic: true
  compute_exact: true

model:
  ansatz: gpt           # Causal Transformer autoregressive wavefunction
  d_model: 32
  n_heads: 4
  n_layers: 2
  mlp_ratio: 2
  use_phase: false      # Real positive ground state for TFIM (Perron-Frobenius)

training:
  seed: 42
  n_samples: 1024       # Independent direct samples per step (no MCMC burn-in)
  n_steps: 400
  optimizer: adam
  learning_rate: 0.002
  use_sr: false
  target_rel_error: 0.0005

telemetry:
  experiment_name: tfim1d_L12_transformer
  wandb_project: nqs-colab
  use_wandb: true
  log_every: 10
  checkpoint_every: 50
  checkpoint_dir: checkpoints
  upload_wandb_checkpoint: true
