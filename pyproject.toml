[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nqs-colab-workflow"
version = "0.1.0"
description = "Neural Quantum States (JAX/NetKet + GPT Ansatz) workflow for Google Colab & GCP Sentinel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
colab = [
    "netket>=3.12",
    "flax>=0.8",
    "optax>=0.2",
    "wandb>=0.17",
    "matplotlib>=3.8",
]
monitor = [
    "wandb>=0.17",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
